paths:
    database_file: data/main_db.db
    dataset_parquet: data/dataset.parquet

    baseline_report: reports/latest_metrics/baseline_metrics.txt
    hgb_report: reports/latest_metrics/hgb_metrics.txt
    lightgbm_report: reports/latest_metrics/lightgbm_metrics.txt
    cat_report: reports/latest_metrics/cat_boost_metrics.txt

    trial_path: reports/run_metrics/

dataset:
    returns_windows: [1, 3, 5, 10]
    moving_average_windows: [5, 10, 20]
    volume_standard_deviation_window: 10
    volume_moving_average_window: 20
    returns_clip_range: [-0.2, 0.2]
    target_horizon_days: 30
    target_absolute_minimum_return: 0.07


grid_search:
  metric_for_best: auc_roc

models_grid:
    logistic_regression:
        maximum_iterations: [500, 1000]
        number_of_jobs: [-1]
        class_weight_strategy: ["balanced", null]

    high_gradient_boosting:
        learning_rate: [0.03, 0.05]
        maximum_tree_depth: [4, 6, 8]
        maximum_iterations: [300, 400, 600]
        minimum_samples_per_leaf: [50, 100]
        random_state_seed: [42]

    light_gradient_boosting:
        learning_rate: [0.01, 0.03]
        n_estimators: [300, 500, 800]
        num_leaves: [15, 31, 63]
        min_child_samples: [20, 50]
        random_state: [42]
        subsample: [0.8]
        colsample_bytree: [0.8]
        reg_alpha: [0.0, 0.1]
        reg_lambda: [0.0, 0.5]
        max_depth: [4, 6, 8]
        verbosity: [-1]

    cat_boost_classifier:
        learning_rate: [0.03, 0.05]
        depth: [4, 6, 8]
        iterations: [300, 500, 800]
        l2_leaf_reg: [3, 5, 7]
        random_seed: [42]
        loss_function: ["Logloss"]
        eval_metric: ["AUC"]
        verbose: [False]


split:
    training_ratio: 0.70
    validation_ratio: 0.15


threshold_search:
    best_threshold: 0.50
    logistic_regression_baseline:
        start_threshold: 0.35
        stop_threshold: 0.71
        step_threshold: 0.01
        
    high_gradient_boosting:
        start_threshold: 0.40
        stop_threshold: 0.65
        step_threshold: 0.01

    light_gradient_boosting:
        start_threshold: 0.40
        stop_threshold: 0.65
        step_threshold: 0.01

    cat_boost_classifier:
        start_threshold: 0.40
        stop_threshold: 0.65
        step_threshold: 0.01

models:
    logistic_regression:
        maximum_iterations: 1000
        number_of_jobs: -1
        class_weight_strategy: balanced
    
    high_gradient_boosting:
        learning_rate: 0.05
        maximum_tree_depth: 6
        maximum_iterations: 400
        minimum_samples_per_leaf: 100
        random_state_seed: 42
    
    light_gradient_boosting:
        learning_rate: 0.03
        n_estimators: 500
        num_leaves: 31
        min_child_samples: 50
        random_state: 42
        subsample: 0.80
        colsample_bytree: 0.80
        reg_alpha: 0.1
        reg_lambda: 0.5
        max_depth: 6
        verbosity: -1

    cat_boost:
        learning_rate: [0.03, 0.05]
        depth: [4, 6, 8]
        iterations: [300, 500, 800]
        l2_leaf_reg: [3, 5, 7]
        random_seed: [42]
        loss_function: ["Logloss"]
        eval_metric: ["AUC"]
        verbose: [False]


features:
    categorical: [ticker]
    dataset_columns:
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
        - day_range
        - day_body
        - volume_change_1
        - volume_moving_avg_20
        - volume_ratio_20
        - ret1_z_20

    baseline:
        - ticker
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
    
    hgb_lgb_cat:
        - ticker
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
        - day_range
        - day_body
        - volume_change_1
        - volume_moving_avg_20
        - volume_ratio_20
        - ret1_z_20


market_data:
    start_date: 2010-01-01
    end_date: 2026-03-15
    data_interval: 1d
    request_sleep_seconds: 1


tickers:
