paths:
    database_file: data/main_db.db
    dataset_parquet: data/dataset.parquet
    baseline_report: reports/baseline_metrics.txt
    hgb_report: reports/hgb_metrics.txt
    report_dir: reports
    scripts_dir: scripts


dataset:
    returns_windows: [1, 3, 5, 10]
    moving_average_windows: [5, 10, 20]
    volume_standard_deviation_window: 10
    volume_moving_average_window: 20
    returns_clip_range: [-0.2, 0.2]
    target_horizon_days: 20
    target_absolute_minimum_return: 0.05
    dropna_target_columns: ['target', future_ret_5]


split:
    training_ratio: 0.70
    validation_ratio: 0.15


threshold_search:
    logistic_regression_baseline:
        start_threshold: 0.35
        stop_threshold: 0.71
        step_threshold: 0.01
    high_gradient_boosting:
        start_threshold: 0.30
        stop_threshold: 0.71
        step_threshold: 0.01


models:
    logistic_regression:
        maximum_iterations: 1000
        number_of_jobs: -1
        class_weight_strategy: balanced
    high_gradient_boosting:
        learning_rate: 0.05
        maximum_tree_depth: 6
        maximum_iterations: 400
        minimum_samples_per_leaf: 100
        random_state_seed: 42


features:
    categorical: [ticker]
    dataset_columns:
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
        - day_range
        - day_body
        - volume_change_1
        - volume_moving_avg_20
        - volume_ratio_20
        - ret1_z_20

    baseline:
        - ticker
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
    
    high_gradient_boosting:
        - ticker
        - returns_1
        - returns_3
        - returns_5
        - returns_10
        - moving_avg_5
        - moving_avg_10
        - moving_avg_20
        - volume_10
        - close_mavg_5_ratio
        - close_mavg_20_ratio
        - day_range
        - day_body
        - volume_change_1
        - volume_moving_avg_20
        - volume_ratio_20
        - ret1_z_20


market_data:
    start_date: 2010-01-01
    end_date: 2026-03-15
    data_interval: 1d
    request_sleep_seconds: 1


